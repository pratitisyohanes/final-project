services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_db"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/booking_db
      JWT_ACCESS_SECRET: docker-access-secret-change-me
      JWT_REFRESH_SECRET: docker-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    ports:
      - "5000:5000"

  web:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
