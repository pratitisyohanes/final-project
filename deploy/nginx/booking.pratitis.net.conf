# Nginx site for the booking app: React files from disk, /api and /health forwarded to Express on port 5000
# Install: sudo cp booking.pratitis.net.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/booking.pratitis.net.conf /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name booking.pratitis.net;

    root /var/www/booking/frontend/dist;
    index index.html;

    client_max_body_size 2m;

    # Internal routes are only for pos-api calling 127.0.0.1:5000 directly
    location /api/v1/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
    }

    # Hashed build files never change, so browsers may cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path belongs to React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
